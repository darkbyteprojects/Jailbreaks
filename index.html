<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jailbreaks — Prompt Library by DarkByteProjects</title>
<meta name="description" content="Curated prompt library. One tap to copy. By DarkByteProjects.">
<meta name="theme-color" content="#06060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #06060a;
    --bg-elev: #0c0c14;
    --surface: rgba(255,255,255,0.035);
    --surface-2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.16);
    --text: #f2f2f7;
    --text-dim: #a0a0b5;
    --text-dimmer: #6b6b82;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --grad: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
    --radius: 16px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.8);
    --shadow-glow: 0 0 40px -10px rgba(139,92,246,0.35);
    --title-size: clamp(42px, 8vw, 84px);
    --title-lh: 0.8;
    --safe-top: env(safe-area-inset-top, 0px);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: clip;
    position: relative;
    line-height: 1.5;
  }

  @keyframes floatGradients {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(2%,2%) scale(1.05); }
    100% { transform: translate(0,0) scale(1); }
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 700px 450px at 15% 0%,   rgba(139,92,246,.11), transparent 60%),
      radial-gradient(ellipse 800px 550px at 88% 15%,  rgba(6,182,212,.08),  transparent 60%),
      radial-gradient(ellipse 600px 500px at 50% 105%, rgba(139,92,246,.07), transparent 60%);
    pointer-events:none; z-index:0;
    animation: floatGradients 15s ease-in-out infinite alternate;
  }

  .container { max-width:1200px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }

  .page { position:relative; padding-top:calc(80px + var(--safe-top)); }

  /* TOP NAV LINK */
  .top-nav-link {
    position: fixed;
    top: calc(24px + var(--safe-top));
    right: 24px;
    z-index: 200;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 9px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    color: var(--text-dim);
    text-decoration: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .top-nav-link:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--border-2);
    color: var(--text);
    transform: translateY(-1px);
  }
  @media (max-width: 768px) {
    .top-nav-link { display: none; }
  }

  /* BRAND */
  .brand-title {
    position:sticky;
    top:calc(var(--safe-top) - var(--title-size) * 0.08);
    z-index:90; width:fit-content; margin:0 auto;
    padding:0.13em 0.1em 0;
    font-size:var(--title-size); font-weight:800;
    letter-spacing:-0.045em; line-height:var(--title-lh);
    background:linear-gradient(180deg,#ffffff 0%,#8a8aa0 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    pointer-events:none; will-change:scale;
  }
  .brand-name-wrap {
    position:sticky;
    top:calc(var(--safe-top) + var(--title-size) * 0.85);
    z-index:89; width:fit-content; margin:0 auto 30px;
    display:grid; pointer-events:none;
  }
  .brand-name-wrap .ghost {
    grid-area:1/1; padding:0 0.1em;
    font-size:var(--title-size); font-weight:800;
    letter-spacing:-0.045em; height:0; line-height:0;
    overflow:hidden; visibility:hidden; white-space:nowrap;
  }
  .brand-name {
    grid-area:1/1; justify-self:end; align-self:start;
    margin-right:calc(var(--title-size) * 0.1);
    font-size:16.5px; font-weight:600; line-height:0.8;
    padding-bottom:0.3em; white-space:nowrap;
    background:var(--grad);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  body::after {
    content:'';
    position:fixed; top:0; left:0; right:0;
    height:calc(var(--safe-top) + var(--title-size) * 0.85 + 18px + 48px);
    background:linear-gradient(to bottom, rgba(6,6,10,.92) 0%, rgba(6,6,10,.7) 50%, rgba(6,6,10,0) 100%);
    pointer-events:none; z-index:80;
  }
  @keyframes headerFade { from{opacity:0} to{opacity:1} }
  @supports (animation-timeline: scroll()) {
    body::after {
      opacity:0; animation:headerFade linear both;
      animation-timeline:scroll(root); animation-range:0 260px;
    }
  }

  /* HERO */
  .hero.container {
    padding:0 24px 72px; text-align:center;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .subtitle { font-size:16.5px; color:var(--text-dim); max-width:540px; margin:0 auto; line-height:1.65; text-align:center; }

  .stats {
    display:flex; justify-content:center; align-items:center;
    gap:40px; margin-top:38px; flex-wrap:wrap;
    overflow:visible;
    padding:8px 16px 12px;
  }
  .stat { --lab:26px; display:flex; flex-direction:row; align-items:center; width:fit-content; overflow:visible; }
  .stat-label {
    order:1; position:relative; z-index:0;
    padding:0 0 0; font-size:var(--lab); font-weight:700;
    letter-spacing:-0.02em; line-height:1.1; white-space:nowrap;
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - var(--lab)*1.05),rgba(0,0,0,.22) 100%);
            mask-image:linear-gradient(to right,#000 0,#000 calc(100% - var(--lab)*1.05),rgba(0,0,0,.22) 100%);
    overflow:visible;
  }
  .stat-num {
    order:2; position:relative; z-index:1;
    margin-left:calc(var(--lab) * -0.42);
    padding:0.12em 0.06em 0.18em;
    font-size:62px; font-weight:800;
    letter-spacing:-0.04em; line-height:0.9;
    font-variant-numeric:tabular-nums;
    filter:drop-shadow(0 0 6px rgba(6,6,10,.9));
    transform-origin:center;
    transition:transform 0.3s ease;
    overflow:visible;
  }
  .stat:hover .stat-num { transform:scale(1.06); }

  /* CONTROLS */
  .controls { display:flex; flex-direction:column; gap:18px; margin-bottom:36px; }

  .bar-svg { position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:0; }
  .bar-svg .bar-base { fill:var(--surface); stroke:var(--border); stroke-width:1; stroke-linejoin:round; transition:fill .3s, stroke .3s; }
  .bar-svg .bar-spot, .bar-svg .bar-edge { opacity:0; stroke-linejoin:round; }

  /* FILTER BAR */
  .tabs-wrap { position:relative; }
  .tabs-wrap { position: relative; overflow: visible; }
  .tabs {
    position:relative; z-index:1; display:flex; gap:6px; padding:6px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab-ind {
    position:absolute; left:0; top:0; width:100%; height:100%;
    overflow:visible; pointer-events:none; z-index:0;
    filter:drop-shadow(0 0 12px rgba(139,92,246,.45));
  }
  .tab {
    position:relative; z-index:1; flex-shrink:0;
    padding:10px 16px; background:transparent; border:none; border-radius:9px;
    color:var(--text-dim); font-family:var(--font); font-size:13.5px; font-weight:500;
    cursor:pointer; transition:color .3s; white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px;
  }
  .tab:hover { color:var(--text); }
  .tab.active { color:#fff; }
  .tab.tab-multi .tab-label {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 600;
}
.tab.tab-multi.active .tab-label {
  background: none;
  -webkit-background-clip: unset; background-clip: unset;
  -webkit-text-fill-color: #fff;
  color: #fff;
}
.tab.tab-multi .tab-count {
  background: rgba(139,92,246,.15);
  color: #a78bfa;
}
.tab.tab-multi.active .tab-count {
  background: rgba(255,255,255,.22);
  color: #fff;
}
  .tab-label { display:inline-flex; font-kerning:none; }
  .ch { display:inline-block; white-space:pre; transform-origin:50% 50%; will-change:scale; }
  .tab-count {
    display:inline-block; padding:1px 7px;
    background:rgba(0,0,0,.22); border-radius:6px;
    font-size:11px; font-family:var(--mono); font-weight:600;
    transition:background .3s; transform-origin:50% 50%; will-change:scale;
  }
  .tab.active .tab-count { background:rgba(0,0,0,.3); }
  .tabs-arrow { display:none; }
  @media (hover:hover) and (pointer:fine) {
    .tabs-arrow {
      position:absolute; top:50%; margin-top:-16px;
      width:32px; height:32px; display:grid; place-items:center; z-index:5;
      border:none; background:transparent; color:var(--text); cursor:pointer;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));
      opacity:0; scale:0.8; pointer-events:none;
      transition:opacity .25s, scale .3s cubic-bezier(0.34,1.56,0.64,1), background .2s;
    }
    .tabs-arrow.show { opacity:1; scale:1; pointer-events:auto; }
    .tabs-arrow:active { scale:0.9; }
    .tabs-arrow.left  { left:8px; }
    .tabs-arrow.right { right:8px; }
    .tabs-arrow > svg:not(.bar-svg) { position:relative; z-index:1; }
    .tabs-arrow .bar-base { fill:var(--bg-elev); stroke:var(--border-2); }
    .tabs-arrow:hover .bar-base { fill:#1a1a26; }
    .tabs-arrow.has-active { color:#fff; filter:drop-shadow(0 0 10px rgba(139,92,246,.6)); }
    .tabs-arrow.has-active .bar-base { fill:url(#indG); stroke:rgba(255,255,255,.35); }
  }

  /* Mobile active-tab hint arrows — touch only */
.mob-tab-hint {
  display: none;
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  box-shadow: 0 0 12px rgba(139,92,246,.55);
  border: none; color: #fff;
  align-items: center; justify-content: center;
  z-index: 6; cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity .3s cubic-bezier(0.16,1,0.3,1),
              transform .3s cubic-bezier(0.16,1,0.3,1);
}
.mob-tab-hint svg { width: 13px; height: 13px; }
.mob-tab-hint.left  { left: 6px; }
.mob-tab-hint.right { right: 6px; }

@media (hover: none), (pointer: coarse) {
  .mob-tab-hint { display: flex; }
  .mob-tab-hint.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) scale(1);
  }
}

  /* SEARCH BAR */
  .search-wrap { position:relative; }
  .search-wrap > .search-icon {
    position:absolute; left:18px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--text-dimmer);
    pointer-events:none; transition:color .3s; z-index:3;
  }
  .search-wrap:focus-within > .search-icon { color:var(--violet); }
  .search {
    position:relative; z-index:1; width:100%; padding:15px 48px;
    background:transparent; border:none; border-radius:13px;
    color:transparent; caret-color:var(--text);
    font-family:var(--font); font-size:14.5px; font-kerning:none;
    font-variant-ligatures:none; outline:none;
  }
  .search::placeholder { color:transparent; }
  .search::selection { color:transparent; background:rgba(139,92,246,.35); }
  .search-mirror {
    position:absolute; left:48px; right:48px; top:0; bottom:0;
    display:flex; align-items:center; overflow:hidden;
    pointer-events:none; z-index:2;
    font-family:var(--font); font-size:14.5px; font-kerning:none;
    font-variant-ligatures:none; white-space:pre; color:var(--text);
  }
  .search-mirror .mi { display:flex; flex:none; will-change:transform; }
  .search-mirror .mi.ph { color:var(--text-dimmer); }
  .search-mirror .ch { flex:none; }
  .search-wrap:focus-within .bar-base { stroke:rgba(139,92,246,.6); fill:rgba(139,92,246,.05); }
  .search-wrap:focus-within .bar-svg { filter:drop-shadow(0 0 7px rgba(139,92,246,.35)); }
  .search-clear {
    position:absolute; right:10px; top:50%; z-index:3;
    width:28px; height:28px; margin-top:-14px;
    display:grid; place-items:center; border:none; border-radius:50%;
    background:var(--surface-2); color:var(--text-dim); cursor:pointer;
    opacity:0; scale:0.6; pointer-events:none;
    transition:opacity .2s, scale .3s cubic-bezier(0.34,1.56,0.64,1), background .2s, color .2s;
  }
  .search-clear svg { width:14px; height:14px; }
  .search-clear:hover { background:rgba(255,255,255,.14); color:var(--text); }
  .search-wrap.has-value .search-clear { opacity:1; scale:1; pointer-events:auto; }

/* ── DISCLAIMER ─────────────────────────────────────────── */
.disclaimer {
  position: relative;
  isolation: isolate;
  padding: 11px 16px 11px 18px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-dimmer);
  font-family: var(--font);
  cursor: default;
}
.disclaimer > .bar-svg { z-index: 0; }
.disclaimer .bar-svg .bar-base {
  fill: rgba(139,92,246,.055);
  stroke: rgba(139,92,246,.18);
  transition: fill .3s, stroke .3s;
}
.disclaimer:hover .bar-svg .bar-base {
  fill: rgba(139,92,246,.09);
  stroke: rgba(139,92,246,.32);
}

/* accent line — lives INSIDE the bar shape, inset from edges */
.disc-accent {
  position: absolute;
  left: 7px; top: 7px; bottom: 7px;
  width: 2px;
  background: rgba(139,92,246,.5);
  border-radius: 1px;
  z-index: 2;
  pointer-events: none;
  transition: background .3s, box-shadow .3s;
}
.disclaimer:hover .disc-accent {
  background: rgba(167,139,250,.8);
  box-shadow: 0 0 8px rgba(139,92,246,.5);
}

.disclaimer-text,
.disclaimer-toggle { position: relative; z-index: 1; }
.disclaimer strong { font-weight: 600; letter-spacing: .01em; color: var(--text-dim); }

/* ch spans inside disclaimer — inline-block so scale works */
.disclaimer-text .ch {
  display: inline-block;
  white-space: pre;
  transform-origin: 50% 50%;
  will-change: scale;
}

.disclaimer-text { display: block; }
.disclaimer-toggle { display: none; }

.disc-text-wrap { position: relative; }

.disc-word {
  display: inline-block;
  white-space: nowrap;
}

@media (max-width: 640px) {
  /* Add padding-right to WRAPPER so toggle never overlaps text in either state */
  .disc-text-wrap {
    position: relative;
    padding-right: 22px;
  }

  /* Remove padding-right from both text states */
  .disclaimer-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    /* NO padding-right here */
  }
  .disclaimer-text.expanded {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    /* NO padding-right here */
  }

  /* Toggle stays absolute in BOTH states — no JS override needed */
  .disclaimer-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20.4px;
    background: none;
    border: none;
    padding: 0;
    color: var(--text-dimmer);
    cursor: pointer;
    transition: color .2s;
  }
  .disclaimer-toggle:hover { color: var(--text); }
  .disclaimer-toggle svg {
    width: 16px; height: 16px;
    transition: transform .3s cubic-bezier(0.16,1,0.3,1);
  }
  .disclaimer-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
}

  /* GRID
     align-items:start so each card is sized by its OWN content.
     Cards are NOT stretched to row height — each card stands alone.
     This is the fundamental fix: no card can be forced taller by a sibling. */
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
    margin-bottom:80px;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .card {
    --desc-lh:21.6px; --mx:50%; --my:50%; --sx:0px; --sy:0px;
    transform-origin:50% 50%; 
    position:relative;
    background:var(--surface); 
    border:1px solid var(--border);
    border-radius:var(--radius); 
    padding:22px;
    display:flex; 
    flex-direction:column; 
    overflow: visible;
    opacity:0; 
    will-change:opacity,translate,scale;
    transition:border-color .3s, background .3s, box-shadow .3s;
  }
  
  .card > .desc-overlay {
    overflow: hidden;
    border-radius: var(--radius);
  }

  /* .no-stretch is intentionally removed — it caused shrinkage bugs */

  .card > * { position:relative; z-index:1; }
  .card::after {
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(260px circle at var(--mx) var(--my),
      rgba(139,92,246,.20) 0%, rgba(6,182,212,.08) 45%, transparent 75%);
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:0;
  }
  .card::before {
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:
      radial-gradient(190px circle at var(--mx) var(--my),rgba(167,139,250,.95),rgba(6,182,212,.4) 45%,transparent 75%),
      linear-gradient(135deg,rgba(139,92,246,.22),transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:2;
  }
  .card:hover { border-color:var(--border-2); background:var(--surface-2); box-shadow:var(--sx) calc(var(--sy) + 14px) 34px -12px rgba(139,92,246,.3); z-index:3; }
  .card:hover::before, .card:hover::after { opacity:1; }

  .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; }

  .badge {
    --c:#8b5cf6;
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:8px;
    font-size:10.5px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; font-family:var(--mono); white-space:nowrap;
    color:var(--c); background:color-mix(in srgb,var(--c) 12%,transparent);
  }
  .badge::before {
    content:''; width:5px; height:5px; border-radius:50%;
    background:currentColor; box-shadow:0 0 8px currentColor; flex-shrink:0;
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.45} }

  .card-index { font-family:var(--mono); font-size:11.5px; color:var(--text-dimmer); font-weight:500; flex-shrink:0; }

  .card-models {
    display:flex; flex-wrap:wrap; gap:4px;
    margin-bottom:8px;
  }
  .card-model-chip {
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 7px; border-radius:5px;
    font-family:var(--mono); font-size:10px; font-weight:600;
    letter-spacing:.04em; text-transform:uppercase;
    color:var(--chip-color, var(--text-dimmer));
    background:color-mix(in srgb,var(--chip-color, var(--text-dimmer)) 11%,transparent);
    white-space:nowrap;
  }

  .card-title { font-size:16.5px; font-weight:600; letter-spacing:-.012em; line-height:1.35; margin-bottom:4px; color:var(--text); }

  .desc-wrap { position:relative; flex:1; margin-bottom:12px; min-height:0; }
  .card-desc {
    margin:0; padding-right:26px; font-size:13.5px;
    line-height:var(--desc-lh); color:var(--text-dim);
    /* Default: clamp to 2 lines, overridden by --clamp-lines when chips need compensation */
    display:-webkit-box; -webkit-line-clamp:var(--clamp-lines, 2); -webkit-box-orient:vertical;
    overflow:hidden;
    /* Smooth height animation for expand/collapse */
    transition:height .35s cubic-bezier(0.16,1,0.3,1);
  }
  /* When expanded: show all text, no line clamp */
  .card-desc.expanded {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  /* ── FEEDBACK BUTTONS ON CARD ── */
.card-actions-row2 { margin-top: 8px; }
.card-feedback { display:flex; align-items:center; gap:7px; overflow:hidden; max-height:0; padding:0; transition:max-height .35s cubic-bezier(0.16,1,0.3,1), padding .35s cubic-bezier(0.16,1,0.3,1), margin-top .35s cubic-bezier(0.16,1,0.3,1); }
.card-feedback.open { max-height: 80px; padding: 5px 0 8px; margin-top:3px; }
.btn-options { width: 100%; color: var(--text-dim); }

.btn-feedback {

.btn-fb-broken {

/* Status btn — same shell as btn-view */

/* ── FEEDBACK MODAL ── */
.fb-overlay {

  display: flex; align-items: center; justify-content: center; padding: 24px;

}

.fb-panel {
  width: 100%; max-width: 380px;

}

.fb-close {

.fb-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.012em; padding-right: 36px; }
.fb-option-row { display: flex; align-items: center; gap: 8px; }
.fb-option-pre { font-size: 12px; color: var(--text-dimmer); }
.fb-option-label {
  padding: 3px 10px; border-radius: 6px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
}
.fb-option-label.working  { color: #10b981; background: rgba(16,185,129,.14); }
.fb-option-label.not-working { color: #f43f5e; background: rgba(244,63,94,.14); }
.fb-section-label { font-size: 11.5px; color: var(--text-dimmer); margin-bottom: -6px; }
.fb-platform-btns { display: flex; gap: 8px; }
.fb-platform-btn {
  flex: 1; padding: 8px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-family: var(--font); font-size: 12.5px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
}
.fb-platform-btn.active { color: var(--text); border-color: var(--violet); background: rgba(139,92,246,.1); }
.fb-platform-btn:hover:not(.active) { background: var(--surface-2); color: var(--text); }
.fb-input-wrap { position: relative; flex: 1; isolation: isolate; }
.fb-username-input {
  width: 100%; padding: 10px 14px;
  background: transparent; border: none; border-radius: 9px;
  color: transparent; caret-color: var(--text);
  font-family: var(--font); font-size: 13.5px; outline: none;
  position: relative; z-index: 1;
}
.fb-username-input::placeholder { color: transparent; }
.fb-username-input::selection { color: transparent; background: rgba(139,92,246,.35); }
.fb-input-mirror {
  position: absolute; left: 14px; right: 14px; top: 0; bottom: 0;
  display: flex; align-items: center; overflow: hidden;
  pointer-events: none; z-index: 0;
  font-family: var(--font); font-size: 13.5px; white-space: pre; color: var(--text);
}
.fb-input-mirror .mi { display: flex; flex: none; will-change: transform; }
.fb-input-mirror .mi.ph { color: var(--text-dimmer); }
.fb-input-mirror .ch { flex: none; }
.fb-input-wrap:focus-within .bar-svg .bar-base { stroke: rgba(139,92,246,.6); fill: rgba(139,92,246,.05); }
.fb-input-wrap:focus-within .bar-svg { filter: drop-shadow(0 0 7px rgba(139,92,246,.35)); }

.fb-verify-status { font-size: 11.5px; color: #f43f5e; min-height: 14px; }

.fb-submit-btn {
  width: 100%; padding: 12px; color: #fff; font-family: var(--font); font-size: 13.5px; font-weight: 600;
}
.fb-submit-btn .bar-svg { filter: drop-shadow(0 4px 10px rgba(139,92,246,.4)); transition: filter .25s; }
.fb-submit-btn:hover:not(:disabled) .bar-svg { filter: drop-shadow(0 8px 16px rgba(139,92,246,.6)); }
.fb-submit-btn .bar-svg .bar-base { fill: url(#indGFb); stroke: none; }
.fb-submit-btn:disabled { opacity: .35; cursor: not-allowed; }

.fb-transparency-note {
  font-size: 11px; color: var(--text-dimmer); line-height: 1.55;
  padding: 8px 10px; margin: -4px 0 2px;
  border-radius: 7px; position: relative; isolation: isolate;
  cursor: default;
}
.fb-transparency-note .bar-svg { z-index: 0; }
.fb-transparency-note .bar-svg .bar-base { fill: rgba(139,92,246,.055); stroke: rgba(139,92,246,.18); transition: fill .3s, stroke .3s; }
.fb-transparency-note:hover .bar-svg .bar-base { fill: rgba(139,92,246,.09); stroke: rgba(139,92,246,.32); }
.fb-transparency-note #fb-note-text { position: relative; z-index: 1; display: block; }
.fb-transparency-note .ch {
  display: inline-block;
  white-space: pre;
  transform-origin: 50% 50%;
  will-change: scale;
}
.fb-transparency-note .disc-word { display: inline-block; white-space: nowrap; }

.fb-platform-btn {
  flex: 1; padding: 8px 12px; border-radius: 9px;
  border: none; background: transparent;
  color: var(--text-dim); font-family: var(--font); font-size: 12.5px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: color .2s;
}
.fb-platform-btn.active { color: var(--text); }
.fb-platform-btn .bar-svg .bar-base { fill: var(--surface); stroke: var(--border); transition: fill .3s, stroke .3s; }
.fb-platform-btn.active .bar-svg .bar-base { fill: rgba(139,92,246,.15); stroke: var(--violet); }
.fb-platform-btn:hover:not(.active) .bar-svg .bar-base { fill: var(--surface-2); stroke: var(--border-2); }

/* ── STATUS MODAL ── */
.status-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  z-index: 110; opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.status-overlay.open { opacity: 1; pointer-events: auto; }
.status-panel {
  width: 100%; max-width: 560px; max-height: 82vh;
  background: var(--bg-elev); border: 1px solid var(--border-2);
  border-radius: 18px; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: var(--shadow);
  transform: scale(.95) translateY(10px);
  transition: transform .4s cubic-bezier(0.16,1,0.3,1);
}
.status-overlay.open .status-panel { transform: scale(1) translateY(0); }
.status-panel-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border); gap: 12px; flex-shrink: 0;
}
.status-panel-title { font-size: 14.5px; font-weight: 600; color: var(--text); letter-spacing: -.012em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-panel-sub { font-size: 10.5px; color: var(--text-dimmer); margin-top: 2px; font-family: var(--mono); letter-spacing: .03em; }
.status-panel-body { flex: 1; overflow-y: auto; padding: 18px 22px 22px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.1) transparent; }
.status-panel-body::-webkit-scrollbar { width: 8px; }
.status-panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
.status-summary {
  display: flex; gap: 10px; margin-bottom: 20px;
  padding: 12px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
}
.status-tally { font-family: var(--mono); font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
.status-tally.working  { color: #10b981; background: rgba(16,185,129,.12); }
.status-tally.not-working { color: #f43f5e; background: rgba(244,63,94,.12); }
.status-entries { display: flex; flex-direction: column; position: relative; }
.status-entry {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; position: relative;
}
.status-entry:not(:last-child)::after {
  content: ''; position: absolute;
  left: 11px; top: 36px; bottom: 0; width: 2px; background: var(--border);
}
.status-entry-dot {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 10px; font-weight: 700; z-index: 1; position: relative;
}
.status-entry-dot.working { background: rgba(16,185,129,.18); border: 1.5px solid #10b981; color: #10b981; }
.status-entry-dot.working::after { content: '✓'; }
.status-entry-dot.broken  { background: rgba(244,63,94,.18); border: 1.5px solid #f43f5e; color: #f43f5e; }
.status-entry-dot.broken::after  { content: '✗'; }
.status-entry-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
.status-entry-info { flex: 1; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.status-entry-user { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); }
.status-entry-badge { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; letter-spacing: .04em; white-space: nowrap; }
.status-entry-badge.working  { color: #10b981; background: rgba(16,185,129,.12); }
.status-entry-badge.broken   { color: #f43f5e; background: rgba(244,63,94,.12); }
.status-entry-platform { font-size: 10px; color: var(--text-dimmer); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.status-entry-time { font-size: 11px; color: var(--text-dimmer); white-space: nowrap; font-family: var(--mono); flex-shrink: 0; }
.status-loading, .status-empty { text-align: center; padding: 48px 20px; font-size: 13.5px; color: var(--text-dimmer); }

@media (max-width: 640px) {
  .fb-panel { padding: 20px; }
  .status-panel { max-height: 92dvh; border-radius: 14px; }
  .status-panel-hdr { padding: 15px 17px; }
  .status-panel-body { padding: 15px 17px 20px; }
  .card-feedback { flex-wrap: wrap; }
}

  /* Description overlay panel */

    position: absolute;
    inset: 0;
    z-index: 20;
    border-radius: var(--radius);
    background: rgba(12,12,20,0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    flex-direction: column;
    padding: 18px 18px 14px;

    opacity: 1;

  /* TOAST */
  .toast {
    position:fixed; top:calc(var(--safe-top) + 96px); left:50%;
    transform:translateX(-50%) translateY(-16px) scale(.96);

  }

  @keyframes heartbeat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.2)} 30%{transform:scale(1)} 45%{transform:scale(1.15)} }
  .footer-credit a { color:var(--text-dim); text-decoration:none; font-weight:600; transition:color .15s; }
  .footer-credit a:hover { color:var(--text); }

  /* ENTRANCE */

<script>
/* ============================================================
   Data comes from prompts.js (window.SITE)
   ============================================================ */
const SITE    = window.SITE || { models:{}, prompts:[] };
const prompts = SITE.prompts;
const MODELS  = SITE.models;
const RAW_BASE       = SITE.rawBase       || '';
const DEFAULT_CHECKED = SITE.defaultChecked || '2026-01-01';

function modelOf(p) { return MODELS[p.model] || { label: p.model, color: '#8b5cf6' }; }

const cache = new Map();
const lengths = new Map();
let toastTimer = null;
const tabBtns  = new Map();
let modalText  = null;
let tabsBar = null, searchBar = null;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   EASY CONFIG — change placeholder here
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const SEARCH_PLACEHOLDER = 'Search by name or description…';

function formatDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function encodePath(path) { return path.split('/').map(encodeURIComponent).join('/'); }

async function fetchPrompt(path) {
  if (cache.has(path)) return cache.get(path);
  const encoded = encodePath(path);
  try {
    const res = await fetch(encoded, { cache:'no-cache' });
    if (res.ok) { const t = await res.text(); cache.set(path,t); return t; }
  } catch(_) { /* fall through */ }
  const res = await fetch(RAW_BASE + encoded, { cache:'no-cache' });
  if (!res.ok) throw new Error('fetch failed: ' + res.status);
  const t = await res.text(); cache.set(path,t); return t;
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return; } catch(_) {}
  }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(_) {}
  document.body.removeChild(ta);
  if (!ok) throw new Error('copy failed');
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  const icon  = toast.querySelector('.toast-icon');
  toast.querySelector('.toast-msg').textContent = msg;
  icon.textContent = isError ? '!' : '\u2713';
  icon.style.background = isError
    ? 'linear-gradient(135deg,#f43f5e,#f59e0b)'
    : 'linear-gradient(135deg,#10b981,#06b6d4)';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function buildModelChips(p) {
  const m = modelOf(p);
  const models = Array.isArray(p.models) && p.models.length ? p.models : null;
  if (!models) return '';
  return models.map(name =>
    `<span class="card-model-chip" style="--chip-color:${escapeHtml(m.color)}">${escapeHtml(name)}</span>`
  ).join('');
}

function buildCardBadgeRow(p) {
  if (p.model === 'multi' && Array.isArray(p.tags) && p.tags.length) {
    return p.tags.map(key => {
      const tm = MODELS[key] || { label: key, color: '#8b5cf6' };
      return `<span class="badge" style="--c:${escapeHtml(tm.color)}">${escapeHtml(tm.label)}</span>`;
    }).join('');
  }
  const m = modelOf(p);
  let html = `<span class="badge" style="--c:${escapeHtml(m.color)}">${escapeHtml(m.label)}</span>`;
  if (Array.isArray(p.tags))
    p.tags.filter(k => k !== p.model).forEach(key => {
      const tm = MODELS[key] || { label: key, color: '#8b5cf6' };
      html += `<span class="badge" style="--c:${escapeHtml(tm.color)};padding:3px 8px;font-size:9.5px;opacity:.85">${escapeHtml(tm.label)}</span>`;
    });
  return html;
}

function buildNoteChip(p) {

function getActiveModel() {
  const t = document.querySelector('.tab.active');
  return t ? t.dataset.model : 'all';
}

function initBtnBars(root) {
    root.querySelectorAll('.btn').forEach(btn => {
    if (btn.dataset.fluid) return;
    if (btn.classList.contains('btn-fb-working') || btn.classList.contains('btn-fb-broken')) return;
    btn.dataset.fluid = '1';
    const inner = btn.querySelector('.btn-in');
    const bar = createBar(btn, { radius:9, max:4, sigma:34, glow:70 });
    btn._bar = bar;
    bar.setHook(() => { liquidText(btn, bar, [inner]); return false; });
    requestAnimationFrame(() => { bar.draw(); bar.request(); });
  });
}

/* ─────────────────────────────────────────────────────────────────────────────
   updateCardLineClamps
   Compensates for chip-row height differences between cards in the same grid row,
   so descriptions start at the same baseline. Only adjusts --clamp-lines; never
   touches any card that is already expanded.
   ───────────────────────────────────────────────────────────────────────────── */
function updateCardLineClamps() {
  const allCards = document.querySelectorAll('.card');
  // Reset all previous chip-height compensation (but leave expanded cards alone)
  allCards.forEach(c => {
    const d = c.querySelector('.card-desc');
    if (d && d.classList.contains('expanded')) return; // never touch expanded
    c.style.removeProperty('--clamp-lines');
    c.style.removeProperty('--toggle-top-lines');
  });

  if (window.innerWidth < 768) return; // desktop only

  const cards = [...allCards];
  // Group into rows by offsetTop
  const rows = {};
  cards.forEach(c => {
    const top = c.offsetTop;
    if (!rows[top]) rows[top] = [];
    rows[top].push(c);
  });

  Object.values(rows).forEach(row => {
    if (row.length < 2) return;

    // Measure chip-row height per card
    const modelHeights = row.map(c => {
      const m = c.querySelector('.card-models');
      return m ? m.offsetHeight : 0;
    });

    const maxH = Math.max(...modelHeights);
    if (maxH === 0) return;

    row.forEach((c, i) => {
      // Never adjust an already-expanded card
      const d = c.querySelector('.card-desc');
      if (d && d.classList.contains('expanded')) return;

      const diff = maxH - modelHeights[i];
      if (diff < 4) return;

      const lh = parseFloat(getComputedStyle(d).lineHeight) || 21.6;
      const extraLines = Math.max(1, Math.round(diff / lh));
      const totalLines = 2 + extraLines;

      c.style.setProperty('--clamp-lines', totalLines);
      c.style.setProperty('--toggle-top-lines', totalLines - 1);
    });
  });
}

function render() {
  updateTabCounts();
  const model  = getActiveModel();
  const query  = document.getElementById('search').value.trim().toLowerCase();
  const filtered = prompts.filter(p => {
    if (model === 'multi') {
      if (!Array.isArray(p.tags) || !p.tags.length) return false;
    } else if (model !== 'all' && p.model !== model &&
               !(Array.isArray(p.tags) && p.tags.includes(model))) return false;
    if (!query) return true;
    return p.title.toLowerCase().includes(query)
      || p.desc.toLowerCase().includes(query)
      || modelOf(p).label.toLowerCase().includes(query)
      || p.index.toLowerCase().includes(query);
  });

  filtered.sort((a, b) => {
    const am = a.model === 'multi', bm = b.model === 'multi';
    if (am !== bm) return am ? 1 : -1;
    const la = modelOf(a).label.toLowerCase();
    const lb = modelOf(b).label.toLowerCase();
    if (la !== lb) return la.localeCompare(lb);
    return parseInt(a.index, 10) - parseInt(b.index, 10);
  });

  const grid = document.getElementById('grid');
  tilts.clear(); tiltCard = null;

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>No prompts match your search</h3>
        <p>Try a different keyword or pick another AI tab.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(cardHTML).join('');
  initBtnBars(grid);
  updateCardLineClamps();
  queueCards();
  requestAnimationFrame(updateDescToggles);
  setTimeout(() => { updateCardLineClamps(); updateDescToggles(); }, 120);
  grid.querySelectorAll('.btn-copy').forEach(btn => btn.addEventListener('click', handleCardCopy));
  grid.querySelectorAll('.btn-view').forEach(btn => btn.addEventListener('click', handleCardView));
  grid.querySelectorAll('.btn-status').forEach(btn => btn.addEventListener('click', () => openStatusModal(btn.dataset.id)));
  grid.querySelectorAll('.card-feedback .btn-fb-working').forEach(btn => {
  const card = btn.closest('.card'); const id = card.dataset.id;
  btn.addEventListener('click', () => openFeedbackModal('working', id, card));
});
grid.querySelectorAll('.card-feedback .btn-fb-broken').forEach(btn => {
  const card = btn.closest('.card'); const id = card.dataset.id;
  btn.addEventListener('click', () => openFeedbackModal('not-working', id, card));
});
grid.querySelectorAll('.card-feedback .btn-fb-close').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const row = btn.closest('.card-feedback');
    if (row) row.classList.remove('open');
  });
});
}

async function handleCardCopy(e) {
  const btn   = e.currentTarget;
  const inner = btn.querySelector('.btn-in');
  const path  = btn.dataset.path;
  const orig  = inner.innerHTML;
  btn.classList.add('loading'); btn.disabled = true;
  inner.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Copying\u2026`;
  try {
    const text = await fetchPrompt(path);
    await copyText(text);
    btn.classList.remove('loading'); btn.classList.add('copied');
    inner.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Copied!`;
    showToast('Prompt copied to clipboard');
    const fp = prompts.find(x => x.path === path);
    if (fp) showFeedbackButtons(btn.closest('.card'), fp.id);
    setTimeout(() => { btn.classList.remove('copied'); inner.innerHTML = orig; btn.disabled = false; }, 1800);
  } catch(_) {
    btn.classList.remove('loading'); inner.innerHTML = orig; btn.disabled = false;
    showToast('Copy failed \u2014 check your connection', true);
  }
}

/* ── Modal ── */
function updateModalMeta() {
  if (modalText == null) return;
  const body = document.getElementById('modal-body');
  const cs   = getComputedStyle(body);
  const lh   = parseFloat(cs.lineHeight) || 21;
  const pad  = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const lines = Math.max(1, Math.round((body.scrollHeight - pad) / lh));
  document.getElementById('modal-meta').textContent =
    `${modalText.length.toLocaleString()} chars \u00b7 ${lines.toLocaleString()} lines`;
}

async function handleCardView(e) {
  const btn   = e.currentTarget;
  const path  = btn.dataset.path;
  const title = btn.dataset.title;
  const mkey  = btn.dataset.model;
  const p     = prompts.find(x => x.path === path);
  window._modalCurrentPrompt = p || null;
  openModal(title, 'Loading\u2026', (p && p.checked) || DEFAULT_CHECKED, mkey);
  try {
    const text = await fetchPrompt(path);
    document.getElementById('modal-body').textContent = text;
    modalText = text;
    updateModalMeta();
    requestAnimationFrame(updateModalMeta);
    document.getElementById('modal-copy').onclick = async () => {
      try { await copyText(text); showToast('Prompt copied to clipboard'); }
      catch(_) { showToast('Copy failed', true); }
    };
  } catch(_) {
    modalText = null;
    document.getElementById('modal-body').textContent =
      'Failed to load prompt.\n\nCheck your connection, or open the raw file directly:\n' + RAW_BASE + encodePath(path);
    document.getElementById('modal-meta').textContent = '';
  }
}

function openModal(title, body, checked, modelKey) {
  modalText = null;
  releaseAllHover();
  document.getElementById('modal-title').textContent = title;

  const noteEl = document.getElementById('modal-note');
  const noteSrc = window._modalCurrentPrompt;
  if (noteSrc && noteSrc.note) {
    const nc = (SITE && SITE.noteColor) || '#94a3b8';
    noteEl.hidden = false;
    noteEl.style.setProperty('--note-color', nc);
    document.getElementById('modal-note-title').textContent = noteSrc.noteTitle || 'Note';
    document.getElementById('modal-note-text').textContent = noteSrc.note;
  } else {
    noteEl.hidden = true;
  }

  const sub  = document.getElementById('modal-sub');
  const m    = modelKey ? (MODELS[modelKey] || { label: modelKey, color:'#8b5cf6' }) : null;
  let subHTML = '';
  if (m && modelKey !== 'multi') {
    subHTML += `<span class="modal-model-tag" style="--mm-color:${escapeHtml(m.color)}">${escapeHtml(m.label)}</span>`;
  } else if (modelKey === 'multi' && window._modalCurrentPrompt && Array.isArray(window._modalCurrentPrompt.tags)) {
    window._modalCurrentPrompt.tags.forEach(key => {
      const tm = MODELS[key] || { label: key, color: '#8b5cf6' };
      subHTML += `<span class="modal-model-tag" style="--mm-color:${escapeHtml(tm.color)}">${escapeHtml(tm.label)}</span>`;
    });
  }
  if (window._modalCurrentPrompt && Array.isArray(window._modalCurrentPrompt.models) && window._modalCurrentPrompt.models.length) {
    const chips = window._modalCurrentPrompt.models.map(name =>
      `<span class="card-model-chip" style="--chip-color:${escapeHtml(m ? m.color : '#8b5cf6')}">${escapeHtml(name)}</span>`
    ).join('');
    subHTML += `<span style="display:inline-flex;gap:4px;flex-wrap:wrap">${chips}</span>`;
  }
  if (checked) {
    subHTML += `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Last checked</span>
      <time datetime="${escapeHtml(checked)}">${formatDate(checked)}</time>`;
  }
  sub.innerHTML = subHTML;

  const mb = document.getElementById('modal-body');
  mb.textContent = body; mb.scrollTop = 0;
  document.getElementById('modal-meta').textContent = '';
  document.getElementById('modal-copy').onclick = null;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  const bar = document.getElementById('modal-copy')._bar;
  if (bar) requestAnimationFrame(() => { bar.st.px=null; bar.st.amp=0; bar.draw(); bar.request(); });
}

function closeModal() {
  modalText = null;
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  releaseAllHover();
}

/* ============================================================
   LIQUID SHAPE
   ============================================================ */
function liquidShape(L, R, r, top, bot, lift) {
  const N = 14, xs = [], cs = [];
  for (let i = 0; i <= N; i++) {
    const th = Math.PI/2*i/N;
    xs.push(L + r*(1-Math.cos(th))); cs.push(r*(1-Math.sin(th)));
  }
  for (let x = L+r+3; x < R-r-1.5; x+=3) { xs.push(x); cs.push(0); }
  for (let j = 0; j <= N; j++) {
    const th = Math.PI/2*(1-j/N);
    xs.push(R - r*(1-Math.cos(th))); cs.push(r*(1-Math.sin(th)));
  }
  let d = '';
  for (let i = 0; i < xs.length; i++)
    d += (i?'L':'M') + xs[i].toFixed(1)+' '+(top+cs[i]-lift(xs[i])).toFixed(2);
  for (let i = xs.length-1; i >= 0; i--)
    d += 'L'+xs[i].toFixed(1)+' '+(bot-cs[i]+lift(xs[i])).toFixed(2);
  return d+'Z';
}

const TEXT_GAIN = 1.5, TEXT_X = 0.08;
function liquidText(wrapEl, bar, nodes) {
  nodes = nodes.filter(Boolean);
  if (!nodes.length) return;
  const wr = wrapEl.getBoundingClientRect();
  const H  = wrapEl.offsetHeight || 1;
  const cx = nodes.map(n => { const r=n.getBoundingClientRect(); return r.left+r.width/2-wr.left; });
  nodes.forEach((n,i) => {
    const lv = bar.levelAt(cx[i]), lf = bar.lift(cx[i]);
    const sy = 1 + TEXT_GAIN*2*lf/H, sx = 1 + TEXT_X*lv;
    n.style.scale = (sy<1.001&&sx<1.001)?'':`${sx.toFixed(3)} ${sy.toFixed(3)}`;
  });
}

function charSpans(str) {
  return [...str].map(c =>
    `<span class="ch">${c === ' ' ? '\u00a0' : escapeHtml(c)}</span>`
  ).join('');
}

/* ============================================================
   BULGE BAR
   ============================================================ */
const liveBars = new Set();
document.addEventListener('pointermove', e => {
  liveBars.forEach(b => {
    if (!b.wrap.isConnected) { liveBars.delete(b); return; }
    if (b.st.px!==null && !b.wrap.contains(e.target)) { b.st.px=null; b.request(); }
  });
},{passive:true});
document.addEventListener('pointerleave', () => liveBars.forEach(b=>{b.st.px=null;b.request();}));
function releaseAllHover() { liveBars.forEach(b=>{b.st.px=null;b.st.amp=0;b.request();}); tiltRelease(tiltCard); tiltCard=null; }

let barUid = 0;
function createBar(wrap, {radius=14,max=6,sigma=80,glow=130}={}) {
  const NS='http://www.w3.org/2000/svg', id='bs'+(++barUid);
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','bar-svg'); svg.setAttribute('aria-hidden','true');
  svg.setAttribute('preserveAspectRatio','none');
  svg.innerHTML=`
    <defs>
      <radialGradient id="${id}f" gradientUnits="userSpaceOnUse" r="${glow}">
        <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/>
        <stop offset=".5" stop-color="#06b6d4" stop-opacity=".07"/>
        <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="${id}e" gradientUnits="userSpaceOnUse" r="${glow*.85}">
        <stop offset="0" stop-color="#a78bfa" stop-opacity=".95"/>
        <stop offset=".55" stop-color="#06b6d4" stop-opacity=".35"/>
        <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <path class="bar-base"/>
    <path class="bar-spot" fill="url(#${id}f)" stroke="none"/>
    <path class="bar-edge" fill="none" stroke="url(#${id}e)" stroke-width="1.5"/>`;
  wrap.prepend(svg);
  const base=svg.querySelector('.bar-base'), spot=svg.querySelector('.bar-spot'), edge=svg.querySelector('.bar-edge');
  const gF=svg.querySelectorAll('radialGradient')[0], gE=svg.querySelectorAll('radialGradient')[1];
  const st={px:null,py:0,cx:0,cy:0,amp:0,pAmp:0,pX:0,raf:0,hook:null,W:0,r:radius};
  const smooth=t=>t*t*(3-2*t), clamp01=v=>Math.min(1,Math.max(0,v));
  const levelAt=x=>st.amp*Math.exp(-((x-st.cx)**2)/(2*sigma*sigma));
  function bumpAt(x){
    let b=max*levelAt(x);
    if(st.pAmp>0.01) b+=st.pAmp*Math.exp(-((x-st.pX)**2)/(2*(sigma*.7)**2));
    return b;
  }
  const lift=x=>bumpAt(x)*smooth(clamp01(Math.min(x,st.W-x)/(st.r*2)));
  function draw(){
    const W=wrap.offsetWidth,H=wrap.offsetHeight;
    if(!W||!H)return; st.W=W; st.r=Math.min(radius,H/2-.5);
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    const d=liquidShape(.5,W-.5,st.r,.5,H-.5,lift);
    base.setAttribute('d',d); spot.setAttribute('d',d); edge.setAttribute('d',d);
    if(st.onDraw)st.onDraw(d);
    [gF,gE].forEach(g=>{g.setAttribute('cx',st.cx);g.setAttribute('cy',st.cy);g.setAttribute('fx',st.cx);g.setAttribute('fy',st.cy);});
    spot.style.opacity=st.amp; edge.style.opacity=st.amp;
  }
  function tick(){
    st.raf=0;
    if(st.px!==null){
      if(st.amp<.02){st.cx=st.px;st.cy=st.py;}
      else{st.cx+=(st.px-st.cx)*.35;st.cy+=(st.py-st.cy)*.35;}
    }
    st.amp+=((st.px===null?0:1)-st.amp)*.16;
    if(st.amp<.002)st.amp=0;
    st.pAmp*=.92; if(st.pAmp<.02)st.pAmp=0;
    let busy=false; if(st.hook)busy=!!st.hook(); draw();
    if(st.px!==null||st.amp>0||st.pAmp>0||busy)request();
  }
  function request(){if(!st.raf)st.raf=requestAnimationFrame(tick);}
  wrap.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=wrap.getBoundingClientRect();st.px=e.clientX-r.left;st.py=e.clientY-r.top;request();});
  wrap.addEventListener('pointerleave',()=>{st.px=null;request();});
  if('ResizeObserver' in window)new ResizeObserver(()=>{draw();request();}).observe(wrap);
  else window.addEventListener('resize',()=>{draw();request();});
  draw();
  liveBars.add({wrap,st,request});
  return {st,request,draw,levelAt,bumpAt,lift,
    pulse(a){st.pAmp=a;request();},
    setHook(fn){st.hook=fn;},
    setOnDraw(fn){st.onDraw=fn;}};
}

let tabNodes = [];
const IND={l:0,r:0,vl:0,vr:0,init:false,snap:true};

function buildTabs(){
  const tabs=document.getElementById('tabs');
  const counts={
    all:prompts.length,
    multi:prompts.filter(p=>Array.isArray(p.tags)&&p.tags.length>0).length
  };
  prompts.forEach(p=>{
    counts[p.model]=(counts[p.model]||0)+1;
    if(Array.isArray(p.tags))
      p.tags.forEach(t=>{counts[t]=(counts[t]||0)+1;});
  });
  const sortedModelKeys = Object.keys(MODELS)
    .filter(k => k !== 'multi')
    .sort((a,b)=>MODELS[a].label.localeCompare(MODELS[b].label));
  const multiModel = MODELS.multi || { label: 'Multi\u2011AI' };
  const list=[{key:'all',label:'All'},{key:'multi',label:multiModel.label}]
    .concat(sortedModelKeys.map(k=>({key:k,label:MODELS[k].label})));
  list.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===0?' active':'')+(t.key==='multi'?' tab-multi':'');
    b.dataset.model=t.key;
    b.setAttribute('role','tab');
    b.setAttribute('aria-label',t.label);
    b.innerHTML=`<span class="tab-label" aria-hidden="true">${charSpans(t.label)}</span><span class="tab-count">${counts[t.key]||0}</span>`;
    b.addEventListener('click',()=>{
      if(b.classList.contains('active'))return;
      tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      moveIndicator(true);
      if(tabsBar)tabsBar.pulse(5); 
      setTimeout(render, 0);
    });
    tabs.appendChild(b);
    tabBtns.set(t.key, b);
  });
  tabNodes=[...tabs.querySelectorAll('.tab .ch,.tab .tab-count')];
}

function updateTabCounts() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const counts = { all: 0 };
  Object.keys(MODELS).forEach(k => counts[k] = 0);
  prompts.forEach(p => {
    const hit = !q
      || p.title.toLowerCase().includes(q)
      || p.desc.toLowerCase().includes(q)
      || modelOf(p).label.toLowerCase().includes(q)
      || p.index.toLowerCase().includes(q);
    if (!hit) return;
    counts.all++;
    counts[p.model] = (counts[p.model] || 0) + 1;
    if (Array.isArray(p.tags))
      p.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
  });
  tabBtns.forEach((btn, key) => {
    const el = btn.querySelector('.tab-count');
    if (el) el.textContent = counts[key] ?? 0;
  });
}

const headFxGroups=[];

function countUp(el,to,duration=900){
  const start=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*eased);
    if(p<1)requestAnimationFrame(tick);
    else{
      const g=headFxGroups.find(x=>x.el===el);
      const txt=String(to);
      el.setAttribute('aria-label',txt);
      el.innerHTML=`<span aria-hidden="true">${charSpans(txt)}</span>`;
      if(g){g.chars=[...el.querySelectorAll('.ch')].map(n=>({n,sx:1,sy:1}));if(g.grad)applyGradToGroup(g);}
    }
  })(start);
}

    const top=mainTop+c.offsetTop,bottom=top+c.offsetHeight;
    const a=ease(c01((vh-top)/zone)), b=ease(c01((bottom-topLimit)/zone));

    c.style.opacity=p; c.style.translate=`0 ${(1-a)*36-(1-b)*36}px`; c.style.scale=0.92+0.08*p;

   toggleDesc — FIXED

   ───────────────────────────────────────────────────────────────────────────── */
function toggleDesc(btn) {
  const card    = btn.closest('.card');
  const overlay = card.querySelector('.desc-overlay');
  if (!overlay) return;
  const isOpen  = overlay.classList.contains('open');
  if (!isOpen) {
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-label', 'Close description');
    btn.querySelector('svg').style.transform = 'rotate(180deg)';
  } else {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Expand description');
    btn.querySelector('svg').style.transform = '';
  }
}

/* ============================================================
   3D TILT
   ============================================================ */
const TILT_MAX=12,TILT_SCALE=1.05,TILT_PERSP=700;
const tilts=new Map(); let tiltRaf=0,tiltCard=null;
const canTilt=!matchMedia('(prefers-reduced-motion:reduce)').matches;
const clampN=v=>Math.max(-1,Math.min(1,v));
function tiltTo(c,nx,ny){
  let t=tilts.get(c);
  if(!t){t={rx:0,ry:0,s:1,sx:0,sy:0};tilts.set(c,t);}
  t.trx=-ny*TILT_MAX;t.tyr=nx*TILT_MAX;t.ts=TILT_SCALE;t.tsx=-nx*16;t.tsy=-ny*16;
  if(!tiltRaf)tiltRaf=requestAnimationFrame(tiltLoop);
}
function tiltRelease(c){
  const t=c&&tilts.get(c); if(!t)return;
  t.trx=t.tyr=t.tsx=t.tsy=0;t.ts=1;
  if(!tiltRaf)tiltRaf=requestAnimationFrame(tiltLoop);
}
function tiltLoop(){
  tiltRaf=0;let busy=false;
  tilts.forEach((t,c)=>{
    const k=.16;
    t.rx+=(t.trx-t.rx)*k;t.ry+=(t.tyr-t.ry)*k;
    t.s +=(t.ts -t.s )*k;
    t.sx+=(t.tsx-t.sx)*k;t.sy+=(t.tsy-t.sy)*k;
    const rest=t.ts===1&&Math.abs(t.rx)<.02&&Math.abs(t.ry)<.02&&Math.abs(t.s-1)<.0005;
    if(rest){c.style.transform='';c.style.removeProperty('--sx');c.style.removeProperty('--sy');tilts.delete(c);return;}
    c.style.transform=`perspective(${TILT_PERSP}px) rotateX(${t.rx.toFixed(2)}deg) rotateY(${t.ry.toFixed(2)}deg) scale3d(${t.s.toFixed(4)},${t.s.toFixed(4)},${t.s.toFixed(4)})`;
    c.style.setProperty('--sx',t.sx.toFixed(1)+'px');
    c.style.setProperty('--sy',t.sy.toFixed(1)+'px');
    busy=true;
  });
  if(busy)tiltRaf=requestAnimationFrame(tiltLoop);
}

/* ---------- Fluid header text ---------- */
function layoutLeft(el){let x=0,e=el;while(e){x+=e.offsetLeft;e=e.offsetParent;}return x;}
function applyGradToGroup(g){
  if(!g.grad||!g.chars)return;
  g.chars.forEach(c=>{
    c.n.style.backgroundImage=g.grad;
    c.n.style.webkitBackgroundClip='text';
    c.n.style.backgroundClip='text';
    c.n.style.webkitTextFillColor='transparent';
    c.n.style.backgroundRepeat='no-repeat';
  });
  syncGradToGroup(g);
}
function syncGradToGroup(g){
  if(!g.grad||!g.chars||!g.chars.length)return;
  const W=g.el.offsetWidth; if(!W)return;
  const base=layoutLeft(g.el);
  g.chars.forEach(c=>{
    const off=layoutLeft(c.n)-base;
    c.n.style.setProperty('--W',W+'px');
    c.n.style.setProperty('--o',off+'px');
  });
}
function syncGrad(){headFxGroups.forEach(g=>{if(g.grad)syncGradToGroup(g);});}

function initHeadFx(){
  const groups=[
    {el:document.getElementById('brand-title'),  sig:.8, gy:.20,gx:.05,reach:.75,grad:'linear-gradient(180deg,#ffffff 0%,#8a8aa0 100%)'},
    {el:document.querySelector('.brand-name'),    sig:2.0,gy:.50,gx:.12,reach:1.6, grad:'var(--grad)'},
    {el:document.querySelector('.subtitle'),      sig:1.5,gy:.15,gx:.04,reach:1.0},
    ...Array.from(document.querySelectorAll('.stat-label')).map(el=>({el,sig:1.2,gy:.25,gx:.06,reach:.8,grad:'var(--grad)'})),
    ...Array.from(document.querySelectorAll('.stat-num')).map(el=>({el,sig:1.2,gy:.25,gx:.06,reach:.8,grad:'linear-gradient(180deg,#ffffff 0%,#8a8aa0 100%)'}))
  ];
  headFxGroups.push(...groups);
  groups.forEach(g=>{
    const txt=g.el.textContent.trim();
    g.el.setAttribute('aria-label',txt);
    g.el.innerHTML=`<span aria-hidden="true">${charSpans(txt)}</span>`;
    g.chars=[...g.el.querySelectorAll('.ch')].map(n=>({n,sx:1,sy:1}));
    if(g.grad)applyGradToGroup(g);
  });
  syncGrad();
  window.addEventListener('resize',syncGrad);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(syncGrad);
  let mx=-9999,my=-9999,raf=0;
  function frame(){
    raf=0;let busy=false;
    groups.forEach(g=>{
      const r=g.el.getBoundingClientRect();
      const fs=parseFloat(getComputedStyle(g.el).fontSize);
      const dy=my-(r.top+r.height/2);
      const vf=Math.exp(-(dy*dy)/(2*(g.reach*fs)**2));
      g.chars.forEach(c=>{
        const cr=c.n.getBoundingClientRect();
        const dx=mx-(cr.left+cr.width/2);
        const w=Math.exp(-(dx*dx)/(2*(g.sig*fs)**2))*vf;
        const ty=1+g.gy*w,tx=1+g.gx*w;
        c.sy+=(ty-c.sy)*.2;c.sx+=(tx-c.sx)*.2;
        if(Math.abs(ty-c.sy)>.001||Math.abs(tx-c.sx)>.001)busy=true;
        c.n.style.scale=(c.sy<1.002&&c.sx<1.002)?'':`${c.sx.toFixed(3)} ${c.sy.toFixed(3)}`;
      });
    });
    if(busy)raf=requestAnimationFrame(frame);
  }
  const go=()=>{if(!raf)raf=requestAnimationFrame(frame);};
  window.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;mx=e.clientX;my=e.clientY;go();},{passive:true});
  document.addEventListener('pointerleave',()=>{mx=my=-9999;go();});
  window.addEventListener('scroll',()=>{if(mx>-1000)go();},{passive:true});
}

let _mobHintTimer = null;
function updateMobHints() {
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const tabs      = document.getElementById('tabs');
  const active    = tabs && tabs.querySelector('.tab.active');
  const lHint     = document.querySelector('.mob-tab-hint.left');
  const rHint     = document.querySelector('.mob-tab-hint.right');
  if (!active || !lHint || !rHint) return;

  const tr = tabs.getBoundingClientRect();
  const ar = active.getBoundingClientRect();
  const offLeft  = ar.right  < tr.left  + 24;
  const offRight = ar.left   > tr.right - 24;

  lHint.classList.toggle('visible', offLeft);
  rHint.classList.toggle('visible', offRight);

  if (offLeft || offRight) {
    clearTimeout(_mobHintTimer);
    _mobHintTimer = setTimeout(() => {
      lHint.classList.remove('visible');
      rHint.classList.remove('visible');
    }, 2500);
  }
}

function disclaimerSpans(str) {
  return str.split(/( )/).filter(t => t.length > 0).map(token =>
    token === ' '
      ? '<span class="ch">\u00a0</span>'
      : `<span class="disc-word">${[...token].map(c =>
          `<span class="ch">${escapeHtml(c)}</span>`
        ).join('')}</span>`
  ).join('');
}

function openFeedbackModal(option, promptId, card) {
  _fbOption = option; _fbPromptId = promptId; _fbCard = card;
  _fbPlatform = 'github'; _verifiedUser = null;
  const lbl = document.getElementById('fb-option-label');
  lbl.textContent = option === 'working' ? '✓ Working' : '✗ Not Working';
  lbl.className = 'fb-option-label ' + (option === 'working' ? 'working' : 'not-working');
  document.getElementById('fb-username').value = '';
  document.getElementById('fb-verify-status').textContent = '';
  const fbSubmitBtn = document.getElementById('fb-submit');
  fbSubmitBtn.disabled = false;
  fbSubmitBtn.querySelector('.btn-in').textContent = 'Submit';
  document.querySelectorAll('.fb-platform-btn').forEach(b => b.classList.toggle('active', b.dataset.platform === 'github'));
  document.getElementById('fb-username').placeholder = 'GitHub username';
  document.getElementById('fb-username').dispatchEvent(new Event('input'));
  document.getElementById('fb-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('fb-username').focus(), 200);
}

function closeFeedbackModal() {
  document.getElementById('fb-modal').classList.remove('open');
  document.body.style.overflow = '';
}

async function handleFbVerify() {
  const username = document.getElementById('fb-username').value.trim();
  if (!username && _fbPlatform !== 'guest') return;
  if (_fbPlatform === 'guest') {
    const name = username || 'Anonymous';
    _verifiedUser = { username: name, name, avatar_url: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=555&color=fff&size=64` };
    document.getElementById('fb-user-avatar').src = _verifiedUser.avatar_url;
    document.getElementById('fb-user-name').textContent = name;
    document.getElementById('fb-user-login').textContent = 'Guest';
    document.getElementById('fb-user-preview').classList.add('show');
    document.getElementById('fb-submit').disabled = false;
    return;
  }
  const btn = document.getElementById('fb-verify-btn');
  btn.disabled = true; btn.textContent = 'Verifying…';
  document.getElementById('fb-user-preview').classList.remove('show');
  document.getElementById('fb-submit').disabled = true;
  document.getElementById('fb-verify-status').textContent = '';
  try {
    if (_fbPlatform === 'github') {
      const res = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);
      if (res.ok) {
        const u = await res.json();
        _verifiedUser = { username: u.login, name: u.name || u.login, avatar_url: u.avatar_url };
        document.getElementById('fb-user-avatar').src = u.avatar_url;
        document.getElementById('fb-user-name').textContent = u.name || u.login;
        document.getElementById('fb-user-login').textContent = '@' + u.login;
        document.getElementById('fb-user-preview').classList.add('show');
        document.getElementById('fb-submit').disabled = false;
      } else {
        document.getElementById('fb-verify-status').textContent = 'GitHub user not found.';
      }
    } else {
      _verifiedUser = { username, name: username, avatar_url: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=5865f2&color=fff&size=64` };
      document.getElementById('fb-user-avatar').src = _verifiedUser.avatar_url;
      document.getElementById('fb-user-name').textContent = username;
      document.getElementById('fb-user-login').textContent = username;
      document.getElementById('fb-user-preview').classList.add('show');
      document.getElementById('fb-submit').disabled = false;
    }
  } catch { document.getElementById('fb-verify-status').textContent = 'Verification failed — check connection.'; }
  btn.disabled = false; btn.textContent = 'Verify';
}

async function handleFbSubmit() {
  const username = document.getElementById('fb-username').value.trim();
  const statusEl = document.getElementById('fb-verify-status');
  if (_fbPlatform !== 'guest' && !username) {
    statusEl.textContent = 'Please enter a username.';
    return;
  }
  const btn = document.getElementById('fb-submit');
  const btnIn = btn.querySelector('.btn-in');
  const origText = btnIn.textContent;
  btn.disabled = true; btnIn.textContent = 'Submitting…';
  statusEl.textContent = '';
  try {
    const res = await fetch(`${FEEDBACK_WORKER}/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        promptId: _fbPromptId,
        username: username || 'Anonymous',
        platform: _fbPlatform,
        option: _fbOption
      })
    });
    if (res.ok) {
      closeFeedbackModal();
      _fbCard?.querySelector('.card-feedback')?.remove();
      showToast('Thanks for your feedback!');
      
      // Update the Status button badge count
      const badge = document.querySelector(`.status-badge[data-count-id="${_fbPromptId}"]`);
      if (badge) {
        let count = parseInt(badge.textContent) || 0;
        badge.textContent = count + 1;
        badge.style.display = 'inline-flex';
      }
      
      if (_fbOption === 'working' && _fbCard) {
        const timeEl = _fbCard.querySelector('.checked time');
        if (timeEl) {
          const now = new Date();
          timeEl.setAttribute('datetime', now.toISOString().split('T')[0]);
          timeEl.textContent = now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
        }
      }
    } else { throw new Error(); }
  } catch {
    showToast('Submission failed. Try again.', true);
    btn.disabled = false; btnIn.textContent = origText;
  }
}

function openStatusModal(promptId) {
  const p = prompts.find(x => x.id === promptId);
  document.getElementById('status-modal-title').textContent = p ? p.title : promptId;
  document.getElementById('status-modal-body').innerHTML = '<div class="status-loading">Loading…</div>';
  document.getElementById('status-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  fetch(`${FEEDBACK_WORKER}/feedback/${encodeURIComponent(promptId)}`)
    .then(r => r.ok ? r.json() : [])
    .then(entries => {
      if (!entries.length) { document.getElementById('status-modal-body').innerHTML = '<div class="status-empty">No feedback yet — be the first.</div>'; return; }
      const w = entries.filter(e => e.option === 'working').length;
      const b = entries.filter(e => e.option !== 'working').length;
      document.getElementById('status-modal-body').innerHTML = `
        <div class="status-summary">
          <span class="status-tally working">✓ ${w} Working</span>
          <span class="status-tally not-working">✗ ${b} Not Working</span>
        </div>
        <div class="status-entries">${[...entries].reverse().map(e => {
          const isW = e.option === 'working';
          const av = e.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(e.username)}&background=333&color=fff&size=56`;
          return `<div class="status-entry">
            <div class="status-entry-dot ${isW?'working':'broken'}"></div>
            <img class="status-entry-avatar" src="${escapeHtml(av)}" onerror="this.src='https://ui-avatars.com/api/?name=?&background=333&color=fff&size=56'" loading="lazy" alt="" />
            <div class="status-entry-info">
              <span class="status-entry-user">@${escapeHtml(e.username)}</span>
              <span class="status-entry-badge ${isW?'working':'broken'}">${isW?'✓ Working':'✗ Not Working'}</span>
              <span class="status-entry-platform">${escapeHtml(e.platform||'github')}</span>
            </div>
            <span class="status-entry-time">${timeAgo(e.timestamp)}</span>
          </div>`;
        }).join('')}</div>`;
    })
    .catch(() => { document.getElementById('status-modal-body').innerHTML = '<div class="status-empty">Failed to load feedback.</div>'; });
}

function closeStatusModal() {
  document.getElementById('status-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function timeAgo(iso) {
  const d = Date.now() - new Date(iso).getTime(), m = Math.floor(d/60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const dy = Math.floor(h/24);
  if (dy < 30) return `${dy}d ago`;
  return `${Math.floor(dy/30)}mo ago`;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  initHeadFx();
  buildTabs();
  document.getElementById('search').placeholder = SEARCH_PLACEHOLDER;
  initBars();
  initTabArrows();
  // Mobile hint arrows: scroll to active on tap, hide on manual scroll
    document.querySelectorAll('.mob-tab-hint').forEach(hint => {
      hint.addEventListener('click', () => {
        const tabs = document.getElementById('tabs');
        const active = tabs.querySelector('.tab.active');
        if (active) tabs.scrollTo({ left: active.offsetLeft - (tabs.clientWidth - active.offsetWidth) / 2, behavior: 'smooth' });
      });
    });
  countUp(document.getElementById('stat-total'),prompts.length);
  countUp(document.getElementById('stat-models'),Object.keys(MODELS).filter(k=>k!=='multi').length,700);
  moveIndicator(false);

  window.addEventListener('scroll',queueCards,{passive:true});
  window.addEventListener('resize',queueCards);

  const search=document.getElementById('search');
  search.addEventListener('input',onSearchChange);
  document.getElementById('search-clear').addEventListener('click',()=>{search.value='';search.focus();onSearchChange();});

  const grid=document.getElementById('grid');
  grid.addEventListener('click', e => {
  const b = e.target.closest('.desc-toggle');
  if (b) { toggleDesc(b); return; }
  const closeBtn = e.target.closest('.desc-overlay-close');
  if (closeBtn) {
    const card    = closeBtn.closest('.card');
    const overlay = card.querySelector('.desc-overlay');
    const btn     = card.querySelector('.desc-toggle');
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden','true');
    if (btn) { btn.setAttribute('aria-expanded','false'); btn.querySelector('svg').style.transform=''; }
  }
});
  grid.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  const c=e.target.closest('.card');
  if(c!==tiltCard){tiltRelease(tiltCard);tiltCard=c;}
  if(!c)return;
  const op=c.offsetParent.getBoundingClientRect();
  const w=c.offsetWidth,h=c.offsetHeight;
  const x=e.clientX-(op.left+c.offsetLeft),y=e.clientY-(op.top+c.offsetTop);
  c.style.setProperty('--mx',x+'px'); c.style.setProperty('--my',y+'px');
  if(canTilt)tiltTo(c,clampN(x/w*2-1),clampN(y/h*2-1));
});
grid.addEventListener('pointerleave',()=>{tiltRelease(tiltCard);tiltCard=null;});

  // Feedback modal
  document.getElementById('fb-close').addEventListener('click', closeFeedbackModal);
  document.getElementById('fb-modal').addEventListener('click', e => { if (e.target.id === 'fb-modal') closeFeedbackModal(); });
  document.getElementById('fb-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleFbSubmit(); });
  document.getElementById('fb-submit').addEventListener('click', handleFbSubmit);
  document.querySelectorAll('.fb-platform-btn').forEach(b => b.addEventListener('click', () => {
    _fbPlatform = b.dataset.platform;
    document.querySelectorAll('.fb-platform-btn').forEach(x => x.classList.toggle('active', x === b));
    document.getElementById('fb-username').value = '';
    document.getElementById('fb-verify-status').textContent = '';
    const inp = document.getElementById('fb-username');
    inp.placeholder = _fbPlatform === 'guest' ? 'Display name (optional)' : (_fbPlatform === 'discord' ? 'Discord username' : 'GitHub username');
    inp.dispatchEvent(new Event('input'));
  }));
  // Status modal
  document.getElementById('status-close').addEventListener('click', closeStatusModal);
  document.getElementById('status-modal').addEventListener('click', e => { if (e.target.id === 'status-modal') closeStatusModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeFeedbackModal();
    closeStatusModal();
    closeModal();
    // close any open desc overlays
    document.querySelectorAll('.desc-overlay.open').forEach(ov => {
      ov.classList.remove('open');
      ov.setAttribute('aria-hidden','true');
      const btn = ov.closest('.card')?.querySelector('.desc-toggle');
      if (btn) { btn.setAttribute('aria-expanded','false'); btn.querySelector('svg').style.transform=''; }
    });
    }
  });

  let rzT;
  window.addEventListener('resize',()=>{
    clearTimeout(rzT);
    rzT=setTimeout(()=>{updateCardLineClamps(); moveIndicator(false);updateDescToggles();updateModalMeta();},150);
  });

  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(()=>{
      moveIndicator(false);updateDescToggles();updateModalMeta();updateArrows();
      tabsBar.draw();tabsBar.request();searchBar.draw();searchBar.request();
    });
  }

  render();
  loadLengths();
  fetchStatusCounts();
  initBtnBars(document.querySelector('.modal-footer'));
  initBtnBars(document.querySelector('.fb-panel'));
  initFbBars();

  // ── Disclaimer: liquid bar + char bulge + mobile collapse ──
const disclaimerEl = document.getElementById('disclaimer');
if (disclaimerEl) {
  // Render char spans so liquidText can scale them
  const discStrong = document.getElementById('disc-strong');
  const discBody   = document.getElementById('disc-body');
  discStrong.innerHTML = disclaimerSpans('Disclaimer — ');
  discBody.innerHTML   = disclaimerSpans(
    'This collection has been created solely for educational purposes only. ' +
    'The author bears no responsibility for any misuse thereof. ' +
    'I extend my sincere gratitude to the original authors of all prompts listed here. ' +
    'This is intended for my personal use only. I hereby declare that certain words and ' +
    'sentences originally authored by the respective authors have been modified by me, ' +
    'solely to better suit my personal convenience.'
  );
  const disclaimerChars = [
    ...disclaimerEl.querySelectorAll('#disc-strong .ch, #disc-body .ch')
  ];

  // Liquid bar — same engine as search + filter
  const disclaimerBar = createBar(disclaimerEl, { radius: 9, max: 5, sigma: 130, glow: 110 });
  disclaimerBar.setHook(() => {
    liquidText(disclaimerEl, disclaimerBar, disclaimerChars);
    return false;
  });

  // Mobile collapse toggle
  const dToggle = document.getElementById('disclaimer-toggle');
  const dText   = document.getElementById('disclaimer-text');
  if (dToggle && dText) {
    dToggle.addEventListener('click', () => {
      const expanded = dToggle.getAttribute('aria-expanded') === 'true';
      dText.classList.toggle('expanded', !expanded);
      dToggle.setAttribute('aria-expanded', String(!expanded));
    });
  }
}
}

init();
</script>
